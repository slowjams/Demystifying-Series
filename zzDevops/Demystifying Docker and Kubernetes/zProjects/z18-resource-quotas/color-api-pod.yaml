apiVersion: v1
kind: Pod
metadata:
  name: color-api
  namespace: dev    
  labels:
    app: color-api
spec:
  containers:
  - name: color-api
    image: slowjams/color-api:1.1.0  
    ports:
      - containerPort: 80
    resources:
      requests:
        cpu: "200m"      # 0.2 CPU cores
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
