apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev      #<--------------------ResourceQuota is applied to this namespace
spec:
  hard:               
    requests.cpu: "2"   
    requests.memory: "2Gi"
    limits.cpu: "3"
    limits.memory: "4Gi"