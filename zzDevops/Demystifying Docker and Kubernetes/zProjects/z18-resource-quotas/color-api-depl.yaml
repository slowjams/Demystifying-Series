apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
  namespace: dev
  labels:
    app: color-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: color-api
  template:
    metadata:
      labels:
        app: color-api
    spec:
      containers:
        - name: color-api
          image: slowjams/color-api:1.1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "200m"   
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"