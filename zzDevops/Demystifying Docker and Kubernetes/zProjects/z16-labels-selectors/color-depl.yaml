apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
spec:
  replicas: 3
  selector:                # condition1 && condition2
    matchLabels:           # <---------condition1
      app: color-api
      environment: local
      tier: backend
    matchExpressions:      # <---------condition2
      - key: managed
        operator: Exists   # <---------has to be uppcase "E" in "Exists"
  template:
    metadata:
      labels:
        app: color-api
        environment: local
        tier: backend
        managed: deployment
    spec:
      containers:
        - name: color-api
          image: slowjams/color-api:1.1.0
          ports:
            - containerPort: 80