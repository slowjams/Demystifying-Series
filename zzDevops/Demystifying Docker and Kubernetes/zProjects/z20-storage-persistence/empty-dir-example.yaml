apiVersion: v1
kind: Pod
metadata:
  name: empty-dir-demo
  labels:
    name: empty-dir-demo
spec:
  containers:
    - name: empty-dir-writer
      image: busybox:1.36.1
      command:
        - 'sh'
        - '-c'
        - 'sleep 3600'
      resources:
        limits:
          memory: '128Mi'
          cpu: '500m'
      volumeMounts:
        - name: temporary-storage    # <-------------- has to match volume's name
          mountPath: /usr/share/temp # <------------- automatically creates the mount directory inside the container if it doesn't already exist
    - name: empty-dir-reader
      image: busybox:1.36.1
      command:
        - 'sh'
        - '-c'
        - 'sleep 3600'
      resources:
        limits:
          memory: '128Mi'
          cpu: '500m'
      volumeMounts:
        - name: temporary-storage  # <-------------- has to match volume's name
          mountPath: /temp
          readOnly: true
  volumes:
    - name: temporary-storage      # <-----------------
      emptyDir: {}