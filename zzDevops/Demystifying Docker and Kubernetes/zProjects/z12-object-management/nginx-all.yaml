apiVersion: v1

kind: Pod

metadata:
  name: nginx-pod
  labels:
    app: nginx

spec:
  containers:
    - name: nginx-container
      image: nginx:1.27.0-alpine
      ports:
        - containerPort: 80

---  # note that the resource order doesn't matter, you can put the Service section first and K8s is smart to put service conneciton pod on hold and once the pod is up and running, it will connect the service to the pod automatically

apiVersion: v1

kind: Service

metadata:
  name: nginx-svc
  labels:
    app: nginx  # <----------just to associate the Service with the Pod, it doesn't have any effect on the Service itself

spec:
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: nginx