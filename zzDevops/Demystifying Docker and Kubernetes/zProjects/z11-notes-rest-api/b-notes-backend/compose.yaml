name: notes-backend

services:
  notes:
    build:
      context: .
      # dockerfile: Dockerfile
      target: production   # match the Dockerfile's target stage name
    ports:
      - 3001:80
    environment:
      - PORT=80
      - DB_URL=mongodb://${NOTES_DB_USER}:${NOTES_DB_PASSWORD}@notes-db/${NOTES_DB_NAME} 
       # docker's string interpolation that looks for value in the .env file (has to be called .env of course)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
    networks:
      - notes-net
    depends_on:
      - notes-db
  notes-db:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    env_file:
      - .env
    volumes:
      - type: volume
        source: notes-db-data
        target: /data/db
      - type: bind
        source: ./db-config/mongo-init.js
        target: /docker-entrypoint-initdb.d/mongo-init.js
        read_only: true
    networks:
      - notes-net

volumes:
  notes-db-data:

networks:
  notes-net:
   

